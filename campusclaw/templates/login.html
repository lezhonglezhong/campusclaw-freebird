<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusClaw · 登录</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body class="auth-page">
    <main class="auth-card" aria-labelledby="login-title">
      <p class="eyebrow">CampusClaw</p>
      <h1 id="login-title">欢迎登录</h1>
      <p class="muted">登录后查看本班材料。</p>
      <form id="login-form" novalidate>
        <label for="account">账号</label>
        <input id="account" name="account" autocomplete="username" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-status" class="status" role="alert" aria-live="polite"></p>
        <button type="submit">登录</button>
      </form>
    </main>
    <script src="{{ url_for('static', filename='login.js') }}" defer></script>
  </body>
</html>
