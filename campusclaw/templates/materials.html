<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusClaw · Materials</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <main class="workspace" aria-labelledby="materials-title">
      <header class="workspace-header">
        <div>
          <p class="eyebrow">CampusClaw</p>
          <h1 id="materials-title">Class materials</h1>
          <p id="user-context" class="muted">Loading your class context…</p>
        </div>
        <button id="logout-button" type="button">Sign out</button>
      </header>
      <p id="workspace-status" class="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="material-list-title">
        <h2 id="material-list-title">Materials</h2>
        <ul id="material-list" class="material-list"></ul>
      </section>
      <section id="material-detail" class="detail" hidden aria-labelledby="material-detail-title">
        <h2 id="material-detail-title">Material details</h2>
        <dl id="material-detail-fields"></dl>
      </section>
      <section id="teacher-upload" hidden></section>
    </main>
    <script src="{{ url_for('static', filename='materials.js') }}" defer></script>
  </body>
</html>
