services:
  campusclaw:
    build: .
    ports:
      - "8000:8000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
